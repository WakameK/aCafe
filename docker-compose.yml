version: "3.8"

services:
  redis:
    image: redis:7.4.0
    restart: no
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acafe-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/aCafe:/app
      - db-data:/app/data
      - staticfiles:/app/staticfiles
    depends_on:
      - redis
    ports:
      - "8000:8000"
    networks:
      - acafe-net

  frontend:
    build:
      context: ./frontend/acafesomewhere
      dockerfile: ../dockerfile
    container_name: acafe-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - acafe-net

volumes:
  db-data:
    driver: local
  staticfiles:
    driver: local
  redis-data:
    driver: local

networks:
  acafe-net:
    driver: bridge
