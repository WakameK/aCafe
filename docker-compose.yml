services:
  redis:
    image: redis:7.4.0
    restart: no
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - acafe-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - acafe-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acafe-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/aCafe:/app
      - ./backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - db-data:/app/data
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - acafe-net

  # 焚火の世話係。火の見回り・止まった接続の掃除・AIキャラの出入りを、15秒おきにやる。
  # backend と同じイメージ・同じDBを使う(これが止まっても、チャット自体は動く)
  desk-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acafe-desk-worker
    entrypoint: []
    command: python manage.py desk_worker
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/aCafe:/app
      - db-data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - acafe-net

  frontend:
    build:
      context: ./frontend/acafesomewhere
      dockerfile: ../dockerfile
    container_name: acafe-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - acafe-net

volumes:
  db-data:
    driver: local
  staticfiles:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local

networks:
  acafe-net:
    driver: bridge
