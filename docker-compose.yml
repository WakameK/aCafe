services:
  redis:
    image: redis:7.4.0
    restart: no
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - acafe-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models
    ports:
      - "11434:11434"
    networks:
      - acafe-net

  # マスターAIの調べもの用の検索サーバー(Google・Bing・DuckDuckGo などをまとめて検索する)
  # 設定は ./searxng/settings.yml。外に公開しないよう、ホスト側は 127.0.0.1 だけで待ち受ける。
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-kuma-search}
    volumes:
      - ./searxng:/etc/searxng
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - acafe-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acafe-backend
    # 開発中は runserver で起動する(コードを保存すると自動で再起動される)。
    # INSTALLED_APPS に daphne があるので、runserver でも WebSocket(/ws/space/ など)が動く。
    # 起動時に entrypoint.sh が migrate を流すので、マイグレーションを追加したら再起動だけでOK。
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/aCafe:/app
      - ./backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - db-data:/app/data
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      searxng:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - acafe-net

  frontend:
    build:
      context: ./frontend/Cafe
      dockerfile: ../dockerfile
    command: npm run dev                  # ← 追加(開発サーバーで起動)
    environment:                          # ← 追加
      - WATCHPACK_POLLING=true            #   Windows で変更が検知されないとき用
    volumes:                              # ← 追加
      - ./frontend/Cafe:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - acafe-net

volumes:
  db-data:
    driver: local
  staticfiles:
    driver: local
  redis-data:
    driver: local
  ollama-data:
    driver: local

networks:
  acafe-net:
    driver: bridge
