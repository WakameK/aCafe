services:
  redis:
    image: redis:7.4.0
    restart: no
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - acafe-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acafe-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/aCafe:/app
      - ./backend/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - db-data:/app/data
      - staticfiles:/app/staticfiles
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - acafe-net

  frontend:
    build:
      context: ./frontend/acafesomewhere
      dockerfile: ../dockerfile
    container_name: acafe-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - acafe-net

volumes:
  db-data:
    driver: local
  staticfiles:
    driver: local
  redis-data:
    driver: local

networks:
  acafe-net:
    driver: bridge
