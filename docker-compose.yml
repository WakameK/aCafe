name: acafe

services:
  redis:
    image: redis:7.4.0
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_web
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: mysite.settings
      PYTHONPATH: /app
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DJANGO_COLLECTSTATIC: "true"
    depends_on:
      - redis
    volumes:
      - ./aCafe:/app:rw
      - static_volume:/app/staticfiles
      - ./aCafe/db.sqlite3:/app/db.sqlite3
    ports:
      - "8000:8000"
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "mysite.asgi:application"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: django_worker
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: mysite.settings
      PYTHONPATH: /app
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    volumes:
      - ./aCafe:/app:rw
      - ./aCafe/db.sqlite3:/app/db.sqlite3
    command: ["python", "manage.py", "runworker", "desk", "--verbosity", "1"]
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/var/lib/ollama

volumes:
  redis_data:
  static_volume:
  ollama_data:
