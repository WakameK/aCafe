{% extends "base.html" %}
{% load static %}

{% block title %}くまの隠れ家{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <script src="{% static 'js/login.js' %}"></script>
{% endblock %}

{% block content %}
    <form id="loginForm">
        <input type="text" name="name" placeholder="名前" required>
        <input type="password" name="login_key" placeholder="合言葉" required>
        <button type="submit">ログイン</button>
    </form>

    <form id="keyForm">
        <input type="password" name="login_key" placeholder="新しい合言葉">
        <button type="submit">登録/更新</button>
    </form>

    <div id="error"></div>



{% endblock %}
