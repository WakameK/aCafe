{% extends "base.html" %}
{% load static %}

{% block title %}あなたの情報{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/profile.js' %}"></script>
{% endblock %}

{% block content %}
    <h1>あなたについて</h1><br>
    <p>オーナーとの会話履歴、そこから作成した情報提供書。持ち帰った女性の作品を閲覧できます。</p><br>
    <p>あなたの呼ばれたい名前を決めることが出来ます。</p><br>
    <form method="post" action="{% url 'update_name' %}">
        {% csrf_token %}
        <label for="name">あなたの名前:</label>
        <input type="text" id="name" name="name" value="{{ user_profile.name }}"><br><br>
        <button type="submit" class="btn btn-primary">更新</button>
    </form><br>


    <section>
        <h2>会話履歴</h2>
        <button id="download-chat-log-btn" class="btn btn-primary">チャット履歴をダウンロード</button>
        <p id="download-status" style="display: none;"></p>
    </section><br>

    <a href="/">トップへ戻る</a><br>

{% endblock %}
