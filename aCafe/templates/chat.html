{% extends "base.html" %}

{% block title %}くまの隠れ家{% endblock %}

{% block content %}
    <h1>カフェのカウンター</h1>
    <p>カフェのマスターが黙々と作業している</p>

    <div id="chat-box"></div>

    <input id="message" type="text" placeholder="メッセージを入力" style="width: 80%;">
    <button onclick="sendMessage()">話しかける</button>

    <script>
        function sendMessage() {
            const msg = document.getElementById("message").value;
            if (!msg) return;

            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += `<div class="user">あなた: ${msg}</div>`;

            fetch("/chat_api/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({ message: msg })
            })
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML += `<div class="bot">Bot: ${data.reply}</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            document.getElementById("message").value = "";
        }

        // ★ Enterキーで送信（Shift+Enterは改行）
        document.getElementById("message").addEventListener("keydown", function(e) {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
    <a href="/index">戻る</a>
{% endblock %}
